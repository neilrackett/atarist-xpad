# XPADEMU.CFG
#
# Every line is key=value, # starts a comment, and a missing file just
# means the defaults below are used. Read once at install: editing this
# while the program is resident changes nothing until the next boot.
#
# Buttons are named by POSITION, never by the letter printed on a pad.
# south is the bottom face button, east the right one, north the top,
# west the left. "a" and "b" are accepted for south and east. There is
# deliberately no "x" or "y": XPAD_X is north and XPAD_Y is west,
# following the Linux kernel, so those letters mean the opposite of
# what an Xbox pad's legend suggests. See the Conventions section of
# README.md. Combine with +.

# Which pad drives joystick 1.
pad=0

# What counts as fire.
#
# Leave this out and every button with no other job becomes fire, which
# is the default: a pad has thirteen buttons, a game asks about one,
# and a player's first instinct is to press things until something
# happens. Set it and it is taken literally, so "fire=south" really
# does leave the rest inert.
#
# Directions are never handed out as fire, however this is set.
#fire=south+east

# A button held for repeating fire. west is the LEFT face button, not
# the one with Y printed on an Xbox pad: see the note above.
autofire=west

# Shots per second while it is held, 1 to 25. Injection runs at 50 Hz,
# so 8 is three ticks held and three released.
autorate=8

# A button that reads as up, for games where up is jump. none to
# disable.
jump=none

# The right stick as the GEM mouse: off to disable entirely.
mouse=on
mousepad=0

# Mouse buttons. By default clicking the right stick in is the left
# button and there is no right button, since most of what this drives
# has no use for one. A button named here stops being fire.
left=thumbr
#right=tl

# Below this deflection the stick is at rest and the pointer does not
# move. 40 matches what the COMpad provider folds the d-pad at.
deadzone=40

# Pointer speed. Higher moves further per tick.
speed=24
